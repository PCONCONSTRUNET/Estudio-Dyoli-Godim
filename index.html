    <link rel="icon" type="image/png" href="/icon-512.png">
    <script>
      (function () {
        try {
          var path = window.location.pathname || "";
          var isAdmin = path.indexOf("/admin") === 0;
          var manifest = document.getElementById("app-manifest");
          var appleTitle = document.getElementById("apple-app-title");
          var appName = document.getElementById("application-name");
          var appleIcon = document.getElementById("apple-touch-icon");
          var appIcon = document.getElementById("app-icon");

          document.documentElement.lang = "pt-BR";
          if (isAdmin) {
            if (manifest) manifest.setAttribute("href", "/manifest-admin.json?v=2");
            if (appleTitle) appleTitle.setAttribute("content", "Dyoli Admin");
            if (appName) appName.setAttribute("content", "Dyoli Admin");
            if (appleIcon) appleIcon.setAttribute("href", "/icon-admin-512.png?v=2");
            if (appIcon) appIcon.setAttribute("href", "/icon-admin-512.png?v=2");
            document.title = "Dyoli Admin";
          } else {
            document.title = "Estúdio Dyoli Godim";
          }
        } catch (e) {}
      })();
    </script>
