    <script>
      // Swap manifest BEFORE the browser parses it for "Add to Home Screen".
      // Runs synchronously in <head> so Chrome/Safari pick up the right manifest on first read.
      (function () {
        try {
          var path = window.location.pathname || "";
          if (path.indexOf("/admin") === 0) {
            var m = document.getElementById("app-manifest");
            if (m) m.setAttribute("href", "/manifest-admin.json");
            var t = document.getElementById("apple-app-title");
            if (t) t.setAttribute("content", "Dyoli Admin");
            document.title = "Dyoli Godim — Admin";
          }
        } catch (e) {}
      })();
    </script>
